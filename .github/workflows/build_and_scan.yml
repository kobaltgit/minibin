name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App
        run: npm run tauri build

      - name: Extract App Version
        id: app_version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = if ($env:GITHUB_REF_NAME -match '^v?([0-9]+\.[0-9]+.*)$') { $Matches[1] } else { $pkg.version }
          $tag = "v$ver"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Target Version: $ver, Tag: $tag"

      - name: Package Release Assets
        shell: pwsh
        run: |
          $ver = "${{ steps.app_version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release_assets
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe "release_assets/MiniBin_${ver}_Setup.exe"
          if (Test-Path src-tauri/target/release/bundle/msi/*.msi) {
            Copy-Item src-tauri/target/release/bundle/msi/*.msi "release_assets/MiniBin_${ver}_Setup.msi"
          }
          Copy-Item src-tauri/target/release/minibin.exe release_assets/MiniBin.exe
          Set-Content -Path release_assets/portable.txt -Value "Этот файл переводит MiniBin в портабельный режим. Настройки и кастомные иконки сохраняются в этой же папке."
          Compress-Archive -Path release_assets/MiniBin.exe, release_assets/portable.txt -DestinationPath "release_assets/MiniBin_${ver}_Portable.zip"

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: minibin-release-assets
          path: release_assets/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: MiniBin ${{ steps.app_version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            release_assets/MiniBin_*_Setup.exe
            release_assets/MiniBin_*_Setup.msi
            release_assets/MiniBin_*_Portable.zip
            release_assets/MiniBin.exe
          draft: false
          prerelease: false
          generate_release_notes: true

