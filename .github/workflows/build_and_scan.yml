name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App
        run: npm run tauri build

      - name: Package Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release_assets/MiniBin_2.0.0_Setup.exe
          Copy-Item src-tauri/target/release/minibin.exe release_assets/MiniBin.exe
          Set-Content -Path release_assets/portable.txt -Value "Этот файл переводит MiniBin в портабельный режим. Настройки и кастомные иконки сохраняются в этой же папке."
          Compress-Archive -Path release_assets/MiniBin.exe, release_assets/portable.txt -DestinationPath release_assets/MiniBin_2.0.0_Portable.zip

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: minibin-release-assets
          path: release_assets/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0' }}
          name: MiniBin v2.0.0
          files: |
            release_assets/MiniBin_2.0.0_Setup.exe
            release_assets/MiniBin_2.0.0_Portable.zip
            release_assets/MiniBin.exe
          draft: false
          prerelease: false
          generate_release_notes: true

