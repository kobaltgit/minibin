[package]
name = "minibin"
version = "2.0.0"
description = "MiniBin - Modern Windows System Tray Recycle Bin"
authors = ["kobalt"]
edition = "2021"

[lib]
name = "minibin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
] }
